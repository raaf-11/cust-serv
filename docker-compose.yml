services:

  postgres:
    image: postgres:16
    container_name: postgres

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: customer_support

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d customer_support"]
      interval: 5s
      retries: 20

  qdrant:
    image: qdrant/qdrant:latest

    container_name: qdrant

    ports:
      - "127.0.0.1:6333:6333"

    volumes:
      - qdrant_data:/qdrant/storage

    # The image ships without curl; a bare TCP connect is enough to know
    # it's accepting connections.
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      retries: 20

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0

    container_name: elasticsearch

    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m

    ports:
      - "127.0.0.1:9200:9200"

    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data

    healthcheck:
      test: ["CMD-SHELL", "curl -fs 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s'"]
      interval: 10s
      retries: 30

  # ---- App (`docker compose up --build`) ----------------------------------
  # Infra-only, for running the backend from the venv as before:
  #   docker compose up -d postgres qdrant elasticsearch

  backend:
    build: .
    container_name: backend

    # Secrets (OPENROUTER_API_KEY, SECRET_KEY, MODEL_NAME...) come from .env;
    # the hosts below override its localhost URLs, which only work outside
    # Docker.
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/customer_support
      QDRANT_URL: http://qdrant:6333
      ELASTICSEARCH_URL: http://elasticsearch:9200
      # Requests arrive via the frontend's nginx; without this every user
      # would share nginx's IP for the per-IP login limits.
      TRUST_PROXY_HEADERS: "true"

    ports:
      - "127.0.0.1:8000:8000"

    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy

    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: frontend

    ports:
      - "3000:80"

    depends_on:
      - backend

    restart: unless-stopped

volumes:
  postgres_data:
  qdrant_data:
  elasticsearch_data:
