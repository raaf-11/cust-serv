server {
    listen 80;
    root /usr/share/nginx/html;

    # /api/chat -> http://backend:8000/chat
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        # The backend's per-IP login limits read this (TRUST_PROXY_HEADERS).
        proxy_set_header X-Forwarded-For $remote_addr;
        # LLM calls can wait out a Groq rate-limit retry.
        proxy_read_timeout 120s;
    }

    # Client-side routes (/chat, /employee, ...) all load index.html.
    location / {
        try_files $uri /index.html;
    }
}
